schema_version: 2

global_rules:
  - Treat idea.md and explicit human feedback as the scientific source of truth.
  - Distinguish established results, new derivations, assumptions, conjectures, and open questions.
  - Never invent citations, commands, numerical results, tests, or completed work.
  - Mark uncertain claims explicitly.
  - Preserve failures and negative results as auditable evidence.
  - Internal resampler frequencies are normally angular frequencies in radians per second; distinguish them explicitly from Hz.
  - The 5-vector model uses the carrier and four sidereal sidebands.
  - Run project Python commands through `conda run -n PBH`.

runtime:
  command_prefix:
    - conda
    - run
    - -n
    - PBH
  scratch_root: /tmp
  codex_timeout_seconds: 1800
  codex_sandbox: workspace-write

validation:
  mode: hybrid

defaults:
  retry:
    enabled: true
    min_attempts: 1
    max_attempts: 3
  planning:
    enabled: true
    instructions:
      - Identify the artifact's core claims, derivations, evidence, or experiment questions before drafting.
      - List assumptions, likely failure modes, and checks that would catch shallow or incorrect work.
      - On retries, respond to each failed validator with a concrete change.

pipeline:
  order:
    - planner
    - literature
    - theory_and_optimization
    - numerical_experiment
    - results_analysis
    - referee

tasks:
  planner:
    kind: planning
    purpose: Turn idea.md and human feedback into an executable research plan with falsifiable decisions.
    depends_on: []
    outputs:
      - path: 00_research_plan.md
        description: Executable research plan and decision criteria.
        required: true
        primary: true
        kind: markdown
    validators:
      - name: plan_completeness
        type: artifact_completeness
        options:
          minimum_chars: 1800
      - name: plan_research_value
        type: research_value
        options:
          required_concepts:
            - central question
            - decisive test
            - next steps
            - unresolved
      - name: plan_semantic_review
        type: codex_rubric
        options:
          criteria:
            - The central dimension-selection problem is stated as a falsifiable optimization problem.
            - Literature, derivation, numerical experiment, sensitivity, and computational-cost work are separated.
            - Every major research question has a proposed test or deliverable.
            - Assumptions and likely bottlenecks are explicit.
    must_include:
      - central research question
      - subquestions
      - required derivations
      - required literature searches
      - required numerical experiments
      - sensitivity versus computational cost
      - decisive tests
      - likely bottlenecks
      - proposed report structure
    on_failure: stop

  literature:
    kind: literature
    purpose: Find and verify related work, identify equivalent formulations, and establish novelty risks.
    depends_on:
      - planner
    outputs:
      - path: 01_literature_review.md
        description: Evidence-backed literature synthesis.
        required: true
        primary: true
        kind: markdown
      - path: papers_to_add_to_zotero.md
        description: Verified papers absent from the known local collection, with DOI, arXiv ID, or URL.
        required: true
        primary: false
        kind: markdown
    validators:
      - name: literature_outputs
        type: artifact_completeness
        options:
          minimum_chars: 2200
      - name: citation_structure
        type: citation_sanity
        options:
          minimum_reference_markers: 8
      - name: literature_semantic_review
        type: codex_rubric
        options:
          criteria:
            - Every substantive claim about prior work is connected to a verifiable source.
            - GW literature and general signal-processing literature are distinguished.
            - The review covers every named method in the task requirements.
            - Novelty claims are hedged and conflicts with prior work are explicit.
            - The Zotero candidate artifact contains only identifiable publications.
    must_include:
      - StackSlide
      - PowerFlux
      - Weave
      - MBTA
      - reduced order quadrature
      - PCA or dimensionality reduction
      - semicoherent template metrics
      - polynomial phase or chirp transforms
      - relevant signal-processing analogues
      - novelty risks
    rules:
      - Use DOI, arXiv identifiers, or direct source URLs wherever possible.
      - Reference paper sections, equations, figures, tables, or page numbers for technical claims when the source is available.
      - Label citation-level knowledge separately from close reading.
    on_failure: stop

  theory_and_optimization:
    kind: theory
    purpose: Develop the mathematical formalism and a costed rule for choosing zeta and coherent duration.
    depends_on:
      - planner
      - literature
    outputs:
      - path: 02_theory_and_optimization.md
        description: Mathematical derivation and optimization framework.
        required: true
        primary: true
        kind: markdown
    validators:
      - name: theory_completeness
        type: artifact_completeness
        options:
          minimum_chars: 3000
      - name: deterministic_math_checks
        type: mathematical_sanity
        options:
          frequency_units: true
          required_concepts:
            - assumptions
            - dimensions or units
            - null distribution
            - signal expectation
            - limiting case
            - open questions
      - name: theory_research_value
        type: research_value
        options:
          required_concepts:
            - conclusion
            - decisive test
            - next steps
            - unresolved
      - name: theory_semantic_review
        type: codex_rubric
        options:
          criteria:
            - Every symbol is defined before use and frequency units are unambiguous.
            - The coherent and semicoherent statistics, null distribution, signal expectation, and weights are mutually consistent.
            - At least one limiting case reduces to ordinary frequency-time StackSlide.
            - The dimension-selection rule includes mismatch, trials factor, runtime, and memory rather than SVD variance alone.
            - Established equations are separated from new derivations and conjectures.
    must_include:
      - signal parameters theta
      - spectral coordinates zeta
      - mapping between theta and zeta
      - coherent chunk statistic
      - semicoherent statistic
      - weights
      - null distribution
      - signal expectation
      - residual phase or mismatch criterion
      - sensitivity versus computational-cost objective
      - rule for choosing the number of zeta dimensions
      - limiting case reducing to ordinary StackSlide
      - equal-mass non-spinning 3.5PN case
      - equal-mass spinning case up to chi 0.2
    cautions:
      - Do not conflate an SVD approximation dimension with the number of searched coordinates.
      - Include the NUFFT noise transfer and 5-vector covariance as unresolved effects where applicable.
    retry:
      enabled: true
      min_attempts: 1
      max_attempts: 4
    on_failure: stop

  numerical_experiment:
    kind: experiment
    purpose: Execute a reproducible comparison of candidate coherent-coordinate models and measure approximation, sensitivity, and computational-cost proxies.
    depends_on:
      - theory_and_optimization
    outputs:
      - path: 03_numerical_experiment.md
        description: What was run, results, failures, and immediate interpretation.
        required: true
        primary: true
        kind: markdown
      - path: experiment/dimension_study.py
        description: Reproducible experiment script.
        required: true
        primary: false
        kind: python
      - path: experiment/parameters.json
        description: Parameter ranges, environment details, and random seeds.
        required: true
        primary: false
        kind: json
      - path: experiment/results.csv
        description: Machine-readable comparison results.
        required: true
        primary: false
        kind: csv
      - path: experiment/commands.log
        description: Exact commands executed.
        required: true
        primary: false
        kind: log
      - path: experiment/stdout.log
        description: Preserved stdout, stderr, warnings, and failures.
        required: true
        primary: false
        kind: log
      - path: experiment/sensitivity_vs_cost.png
        description: Decisive comparison plot, or a clearly labelled diagnostic plot if the full comparison fails.
        required: true
        primary: false
        kind: plot
    validators:
      - name: experiment_outputs
        type: artifact_completeness
        options:
          minimum_chars: 1800
      - name: experiment_file_integrity
        type: experiment_artifacts
        options:
          report_concepts:
            - commands
            - parameters
            - random seed
            - results
            - failures
            - warnings
      - name: experiment_semantic_review
        type: codex_rubric
        options:
          criteria:
            - The declared experiment was actually executed and exact commands and failures are preserved.
            - Parameters, random seeds, waveform assumptions, and software environment are recorded.
            - Results compare frequency-only, 0PN, and SVD/PCA candidates; omissions are explicit failures rather than invented values.
            - Equal-mass non-spinning and chi up to 0.2 spinning cases are either measured or clearly marked as incomplete.
            - Sensitivity and computational cost are not replaced by basis overlap alone.
    must_include:
      - executed commands
      - parameters and random seeds
      - frequency-only baseline
      - 0PN coordinate model
      - SVD or PCA coordinate model
      - equal-mass non-spinning 3.5PN waveforms
      - spinning waveforms up to chi 0.2
      - approximation or mismatch measurement
      - sensitivity proxy
      - runtime and memory proxy
      - failures and warnings
    rules:
      - Start with a bounded experiment that can finish within one agent attempt.
      - Reuse existing repository implementations where reliable, but do not modify them.
      - If a full waveform study is infeasible, execute the largest defensible subset and preserve the limitation.
      - Do not treat generated placeholder values as measurements.
    retry:
      enabled: true
      min_attempts: 1
      max_attempts: 3
    on_failure: stop

  results_analysis:
    kind: analysis
    purpose: Interpret the numerical artifacts against the theoretical decision rule without overstating incomplete results.
    depends_on:
      - theory_and_optimization
      - numerical_experiment
    outputs:
      - path: 04_results_analysis.md
        description: Evidence-linked comparison and scientific interpretation.
        required: true
        primary: true
        kind: markdown
    validators:
      - name: analysis_completeness
        type: artifact_completeness
        options:
          minimum_chars: 1800
      - name: analysis_research_value
        type: research_value
        options:
          required_concepts:
            - conclusion
            - decisive test
            - next steps
            - unresolved
      - name: analysis_semantic_review
        type: codex_rubric
        options:
          criteria:
            - Each numerical conclusion points to a measured result or preserved failure.
            - Approximation quality, sensitivity, trials factor, runtime, and memory are distinguished.
            - Non-spinning and spinning conclusions are separated.
            - The analysis states whether another zeta dimension is justified under the declared decision rule.
    must_include:
      - measured results
      - comparison with theoretical prediction
      - approximation quality
      - sensitivity versus cost
      - equal-mass non-spinning conclusion
      - spinning conclusion
      - limitations
      - decision about zeta dimension
      - next decisive experiment
    on_failure: stop

  referee:
    kind: referee
    purpose: Attempt to falsify the theory, experiment, and claimed conclusions as a skeptical scientific reviewer.
    depends_on:
      - literature
      - theory_and_optimization
      - numerical_experiment
      - results_analysis
    outputs:
      - path: 05_referee_report.md
        description: Prioritized objections and decisive tests tied to artifacts.
        required: true
        primary: true
        kind: markdown
    validators:
      - name: referee_completeness
        type: artifact_completeness
        options:
          minimum_chars: 1800
      - name: referee_structure
        type: referee_quality
        options:
          minimum_concrete_items: 6
          required_concepts:
            - objection
            - decisive test
            - severity
            - artifact
            - recommendation
      - name: referee_semantic_review
        type: codex_rubric
        options:
          criteria:
            - Objections cite specific claims, equations, commands, plots, tables, or missing artifacts.
            - Every major objection includes a severity and a decisive resolving test.
            - Normalization, units, noise transfer, covariance, trials factors, runtime, and memory are examined.
            - The review distinguishes a new cost-sensitivity tradeoff from matched filtering or known semicoherent methods.
    must_include:
      - strongest objections
      - severity and affected artifact for each objection
      - decisive tests
      - unclear assumptions
      - novelty concerns
      - possible normalization errors
      - missing tests
      - whether this is different from matched filtering
      - recommendation
    retry:
      enabled: true
      min_attempts: 1
      max_attempts: 2
    on_failure: continue_with_warning
